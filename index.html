<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a192f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Idea Capture</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#14243b;background:#f8f9fa}body{margin:0}main{max-width:650px;margin:auto;padding:24px 18px 70px}header{background:#0a192f;color:white;padding:24px 18px}header div{max-width:650px;margin:auto}h1{margin:0;font-size:26px}header p{color:#d7dfe9;margin:6px 0 0}.card{background:white;border:1px solid #e1e5eb;border-radius:16px;padding:18px;margin:18px 0;box-shadow:0 3px 12px #1020300a}label{display:block;font-weight:650;margin:12px 0 7px}textarea,input,select{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #aab5c1;border-radius:10px;background:white;color:#14243b}textarea{min-height:115px;resize:vertical}button{border:0;border-radius:10px;padding:12px 15px;font:inherit;font-weight:650;cursor:pointer;background:#0a192f;color:white}button.secondary{background:#e8edf3;color:#14243b}button.danger{background:#fff0f0;color:#9a2323}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #c5a059;outline-offset:2px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.item{border-top:1px solid #e1e5eb;padding:15px 0;overflow-wrap:anywhere}.item p{white-space:pre-wrap;line-height:1.5}.meta{color:#5b6877;font-size:13px}.tag{display:inline-block;background:#f4ebd8;color:#624b19;border-radius:20px;padding:4px 9px;margin-right:8px}.empty{color:#5b6877}.toolbar{display:flex;gap:8px}.toolbar input{flex:1}small{color:#5b6877}#status{min-height:20px;color:#265d38}</style></head><body><header><div><h1>✦ Idea Capture</h1><p>Catch the thought. Keep the possibility.</p></div></header><main><section class="card"><h2 id="formTitle">Capture an idea</h2><form id="ideaForm"><label for="idea">Your idea</label><textarea id="idea" required maxlength="10000" placeholder="What just occurred to you?"></textarea><div class="actions"><button type="button" id="voiceBtn" class="secondary">🎙️ Speak idea</button></div><small id="voiceStatus" role="status" aria-live="polite">Tap to dictate, then review and save.</small><label for="category">Category</label><select id="category"><option>Business</option><option>Clients</option><option>Personal</option><option>Other</option></select><div class="actions"><button id="saveBtn" type="submit">Save idea</button><button type="button" id="cancelBtn" class="secondary" hidden>Cancel edit</button></div><p id="status" role="status" aria-live="polite"></p></form></section><section class="card"><h2>My ideas <span id="count"></span></h2><label for="search">Search ideas</label><input id="search" type="search" placeholder="Search text or category"><div class="actions"><button id="exportBtn" class="secondary" type="button">Export backup</button><button id="importBtn" class="secondary" type="button">Import backup</button><input type="file" id="importFile" accept="application/json,.json" hidden></div><small>Ideas are saved on this device, not sent to a server. Export backups regularly.</small><div id="items"></div></section></main><script>const KEY='idea-capture-v1';let ideas=[];let editing=null;const $=id=>document.getElementById(id);function load(){try{const value=JSON.parse(localStorage.getItem(KEY)||'[]');ideas=Array.isArray(value)?value:[]}catch{ideas=[];alert('Stored ideas could not be read. Please restore a backup.')}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(ideas));return true}catch{alert('Unable to save. Check available device storage.');return false}}function reset(){editing=null;$('ideaForm').reset();$('formTitle').textContent='Capture an idea';$('saveBtn').textContent='Save idea';$('cancelBtn').hidden=true}function render(){const term=$('search').value.trim().toLowerCase();const found=ideas.filter(x=>(x.text+' '+x.category).toLowerCase().includes(term)).sort((a,b)=>b.updated-a.updated);$('count').textContent='('+ideas.length+')';const root=$('items');root.replaceChildren();if(!found.length){const p=document.createElement('p');p.className='empty';p.textContent=term?'No matching ideas.':'No ideas yet. Capture your first one above.';root.append(p)}for(const x of found){const div=document.createElement('article');div.className='item';const meta=document.createElement('div');meta.className='meta';const tag=document.createElement('span');tag.className='tag';tag.textContent=x.category;meta.append(tag,document.createTextNode(new Date(x.created).toLocaleString()));const p=document.createElement('p');p.textContent=x.text;const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='Edit';edit.onclick=()=>{editing=x.id;$('idea').value=x.text;$('category').value=x.category;$('formTitle').textContent='Edit idea';$('saveBtn').textContent='Update idea';$('cancelBtn').hidden=false;window.scrollTo({top:0,behavior:'smooth'});$('idea').focus()};const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=()=>{if(confirm('Delete this idea?')){const next=ideas.filter(i=>i.id!==x.id);const old=ideas;ideas=next;if(!persist())ideas=old;else{if(editing===x.id)reset();render()}}};actions.append(edit,del);div.append(meta,p,actions);root.append(div)}}$('ideaForm').addEventListener('submit',e=>{e.preventDefault();const text=$('idea').value.trim();if(!text)return;const now=Date.now();const old=ideas.slice();if(editing){const x=ideas.find(i=>i.id===editing);if(x){x.text=text;x.category=$('category').value;x.updated=now}}else ideas.push({id:crypto.randomUUID?crypto.randomUUID():String(now)+'-'+Math.random(),text,category:$('category').value,created:now,updated:now});if(!persist()){ideas=old;return}reset();$('status').textContent='Idea saved.';render()});$('cancelBtn').onclick=reset;$('search').oninput=render;$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'idea-capture',version:1,ideas},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='idea-capture-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.app!=='idea-capture'||!Array.isArray(data.ideas)||!data.ideas.every(x=>typeof x.id==='string'&&typeof x.text==='string'&&typeof x.category==='string'&&Number.isFinite(x.created)&&Number.isFinite(x.updated)))throw Error('Invalid backup');if(!confirm('Import backup? Existing ideas with the same ID will be replaced.'))return;const old=ideas.slice();const map=new Map(ideas.map(x=>[x.id,x]));for(const x of data.ideas)map.set(x.id,x);ideas=[...map.values()];if(!persist())ideas=old;render()}catch{alert('This is not a valid Idea Capture backup.')}finally{e.target.value=''}};const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null;let listening=false;const voiceBtn=$('voiceBtn');const voiceStatus=$('voiceStatus');if(SpeechRecognition){recognition=new SpeechRecognition();recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=false;recognition.onresult=e=>{const transcript=Array.from(e.results).map(r=>r[0].transcript).join(' ').trim();if(transcript){$('idea').value=[$('idea').value.trim(),transcript].filter(Boolean).join(' ');voiceStatus.textContent='Captured. Review your idea and tap Save idea.'}};recognition.onerror=e=>{voiceStatus.textContent='Voice input unavailable ('+e.error+'). Try the iPhone keyboard microphone.'};recognition.onend=()=>{listening=false;voiceBtn.textContent='🎙️ Speak idea'};voiceBtn.onclick=()=>{if(listening){recognition.stop();return}try{recognition.start();listening=true;voiceBtn.textContent='■ Stop listening';voiceStatus.textContent='Listening… speak your idea.'}catch{voiceStatus.textContent='Could not start voice input. Try the keyboard microphone.'}}}else{voiceBtn.disabled=true;voiceStatus.textContent='Browser voice recognition is unavailable. Tap the idea field and use the microphone on your iPhone keyboard instead.'}load();render();</script></body></html>

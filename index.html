<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a192f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Idea Capture</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#14243b;background:#f8f9fa}body{margin:0}main{max-width:650px;margin:auto;padding:24px 18px 70px}header{background:#0a192f;color:white;padding:24px 18px}header div{max-width:650px;margin:auto}h1{margin:0;font-size:26px}header p{color:#d7dfe9;margin:6px 0 0}.card{background:white;border:1px solid #e1e5eb;border-radius:16px;padding:18px;margin:18px 0;box-shadow:0 3px 12px #1020300a}label{display:block;font-weight:650;margin:12px 0 7px}textarea,input,select{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #aab5c1;border-radius:10px;background:white;color:#14243b}textarea{min-height:115px;resize:vertical}button{border:0;border-radius:10px;padding:12px 15px;font:inherit;font-weight:650;cursor:pointer;background:#0a192f;color:white}button.secondary{background:#e8edf3;color:#14243b}button.danger{background:#fff0f0;color:#9a2323}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #c5a059;outline-offset:2px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.item{border-top:1px solid #e1e5eb;padding:15px 0;overflow-wrap:anywhere}.item p{white-space:pre-wrap;line-height:1.5}.meta{color:#5b6877;font-size:13px}.tag{display:inline-block;background:#f4ebd8;color:#624b19;border-radius:20px;padding:4px 9px;margin-right:8px}.empty{color:#5b6877}.toolbar{display:flex;gap:8px}.toolbar input{flex:1}small{color:#5b6877}#status{min-height:20px;color:#265d38}.table-wrap{overflow-x:auto;margin-top:15px}.ideas-table{width:100%;border-collapse:collapse;font-size:14px}.ideas-table th{text-align:left;background:#f0f3f7;padding:11px 8px;white-space:nowrap}.ideas-table td{border-bottom:1px solid #e1e5eb;padding:10px 8px;vertical-align:top}.ideas-table .summary{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ideas-table .details-row td{background:#f8f9fa;padding:12px}.details-row p{white-space:pre-wrap;overflow-wrap:anywhere}.expand-btn{padding:6px 9px;font-size:13px}.status-select{padding:7px;font-size:13px;min-width:120px}.table-actions{display:flex;gap:7px;flex-wrap:wrap}.table-actions button{padding:8px 10px;font-size:13px}@media(max-width:480px){main{padding:15px 10px 65px}.card{padding:13px}.ideas-table{font-size:12px}.ideas-table th,.ideas-table td{padding:9px 5px}.ideas-table .summary{max-width:125px}.hide-mobile{display:none}}</style></head><body><header><div><h1>✦ Idea Capture</h1><p>Catch the thought. Keep the possibility.</p></div></header><main><section class="card"><h2 id="formTitle">Capture an idea</h2><form id="ideaForm"><label for="idea">Your idea</label><textarea id="idea" required maxlength="10000" placeholder="What just occurred to you?"></textarea><div class="actions"><button type="button" id="voiceBtn" class="secondary">🎙️ Speak idea</button></div><small id="voiceStatus" role="status" aria-live="polite">Tap to dictate, then review and save.</small><label for="category">Category</label><select id="category"><option>Business</option><option>Clients</option><option>Personal</option><option>Other</option></select><div class="actions"><button id="saveBtn" type="submit">Save idea</button><button type="button" id="cancelBtn" class="secondary" hidden>Cancel edit</button></div><p id="status" role="status" aria-live="polite"></p></form></section><section class="card"><h2>My ideas <span id="count"></span></h2><label for="search">Search ideas</label><input id="search" type="search" placeholder="Search text or category"><div class="actions"><button id="exportBtn" class="secondary" type="button">Export backup</button><button id="importBtn" class="secondary" type="button">Import backup</button><input type="file" id="importFile" accept="application/json,.json" hidden></div><small>Ideas are saved on this device, not sent to a server. Export backups regularly.</small><label for="sort">Sort ideas</label><select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="category">Category</option><option value="status">Status</option></select><div class="actions"><button id="csvBtn" type="button" class="secondary">Export CSV table</button></div><div id="items"></div></section></main><script>const KEY='idea-capture-v1';let ideas=[];let editing=null;const $=id=>document.getElementById(id);function load(){try{const value=JSON.parse(localStorage.getItem(KEY)||'[]');ideas=Array.isArray(value)?value:[]}catch{ideas=[];alert('Stored ideas could not be read. Please restore a backup.')}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(ideas));return true}catch{alert('Unable to save. Check available device storage.');return false}}function reset(){editing=null;$('ideaForm').reset();$('formTitle').textContent='Capture an idea';$('saveBtn').textContent='Save idea';$('cancelBtn').hidden=true}function render(){const term=$('search').value.trim().toLowerCase();const found=ideas.filter(x=>(x.text+' '+x.category+' '+(x.status||'New')).toLowerCase().includes(term));const sort=$('sort').value;found.sort((a,b)=>sort==='oldest'?a.created-b.created:sort==='category'?a.category.localeCompare(b.category):sort==='status'?(a.status||'New').localeCompare(b.status||'New'):b.created-a.created);$('count').textContent='('+ideas.length+')';const root=$('items');root.replaceChildren();if(!found.length){const p=document.createElement('p');p.className='empty';p.textContent=term?'No matching ideas.':'No ideas yet. Capture your first one above.';root.append(p);return}const wrap=document.createElement('div');wrap.className='table-wrap';const table=document.createElement('table');table.className='ideas-table';const thead=document.createElement('thead');const hr=document.createElement('tr');for(const name of ['Date','Category','Idea','Status','']){const th=document.createElement('th');th.textContent=name;th.scope='col';hr.append(th)}thead.append(hr);table.append(thead);const body=document.createElement('tbody');for(const x of found){const tr=document.createElement('tr');const date=document.createElement('td');date.textContent=new Date(x.created).toLocaleDateString();const category=document.createElement('td');category.textContent=x.category;const summary=document.createElement('td');summary.className='summary';summary.textContent=x.text;summary.title=x.text;const statusCell=document.createElement('td');const status=document.createElement('select');status.className='status-select';status.setAttribute('aria-label','Status for '+x.text.slice(0,40));for(const name of ['New','In Progress','Completed']){const opt=document.createElement('option');opt.value=name;opt.textContent=name;status.append(opt)}status.value=['New','In Progress','Completed'].includes(x.status)?x.status:'New';status.onchange=()=>{const previous=x.status;x.status=status.value;const oldUpdated=x.updated;x.updated=Date.now();if(!persist()){x.status=previous;x.updated=oldUpdated;status.value=previous||'New'}else if(sort==='status')render()};statusCell.append(status);const toggleCell=document.createElement('td');const toggle=document.createElement('button');toggle.type='button';toggle.className='secondary expand-btn';toggle.textContent='Show';toggle.setAttribute('aria-expanded','false');toggleCell.append(toggle);tr.append(date,category,summary,statusCell,toggleCell);body.append(tr);const details=document.createElement('tr');details.className='details-row';details.hidden=true;const detailCell=document.createElement('td');detailCell.colSpan=5;const full=document.createElement('p');full.textContent=x.text;const meta=document.createElement('small');meta.textContent='Created: '+new Date(x.created).toLocaleString();const actions=document.createElement('div');actions.className='table-actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='Edit';edit.onclick=()=>{editing=x.id;$('idea').value=x.text;$('category').value=x.category;$('formTitle').textContent='Edit idea';$('saveBtn').textContent='Update idea';$('cancelBtn').hidden=false;window.scrollTo({top:0,behavior:'smooth'});$('idea').focus()};const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=()=>{if(confirm('Delete this idea?')){const old=ideas;ideas=ideas.filter(i=>i.id!==x.id);if(!persist())ideas=old;else{if(editing===x.id)reset();render()}}};actions.append(edit,del);detailCell.append(full,meta,actions);details.append(detailCell);body.append(details);toggle.onclick=()=>{details.hidden=!details.hidden;toggle.textContent=details.hidden?'Show':'Hide';toggle.setAttribute('aria-expanded',String(!details.hidden))}}table.append(body);wrap.append(table);root.append(wrap)}$('ideaForm').addEventListener('submit',e=>{e.preventDefault();const text=$('idea').value.trim();if(!text)return;const now=Date.now();const old=ideas.slice();if(editing){const x=ideas.find(i=>i.id===editing);if(x){x.text=text;x.category=$('category').value;x.updated=now}}else ideas.push({id:crypto.randomUUID?crypto.randomUUID():String(now)+'-'+Math.random(),text,category:$('category').value,created:now,updated:now});if(!persist()){ideas=old;return}reset();$('status').textContent='Idea saved.';render()});$('cancelBtn').onclick=reset;$('search').oninput=render;$('sort').onchange=render;$('csvBtn').onclick=()=>{const escapeCSV=v=>'"'+String(v??'').replaceAll('"','""')+'"';const rows=[['Date','Category','Idea','Status'],...ideas.map(x=>[new Date(x.created).toLocaleDateString(),x.category,x.text,x.status||'New'])];const csv='\uFEFF'+rows.map(row=>row.map(escapeCSV).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='idea-capture-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'idea-capture',version:1,ideas},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='idea-capture-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.app!=='idea-capture'||!Array.isArray(data.ideas)||!data.ideas.every(x=>typeof x.id==='string'&&typeof x.text==='string'&&typeof x.category==='string'&&Number.isFinite(x.created)&&Number.isFinite(x.updated)))throw Error('Invalid backup');if(!confirm('Import backup? Existing ideas with the same ID will be replaced.'))return;const old=ideas.slice();const map=new Map(ideas.map(x=>[x.id,x]));for(const x of data.ideas)map.set(x.id,x);ideas=[...map.values()];if(!persist())ideas=old;render()}catch{alert('This is not a valid Idea Capture backup.')}finally{e.target.value=''}};const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null;let listening=false;const voiceBtn=$('voiceBtn');const voiceStatus=$('voiceStatus');if(SpeechRecognition){recognition=new SpeechRecognition();recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=false;recognition.onresult=e=>{const transcript=Array.from(e.results).map(r=>r[0].transcript).join(' ').trim();if(transcript){$('idea').value=[$('idea').value.trim(),transcript].filter(Boolean).join(' ');voiceStatus.textContent='Captured. Review your idea and tap Save idea.'}};recognition.onerror=e=>{voiceStatus.textContent='Voice input unavailable ('+e.error+'). Try the iPhone keyboard microphone.'};recognition.onend=()=>{listening=false;voiceBtn.textContent='🎙️ Speak idea'};voiceBtn.onclick=()=>{if(listening){recognition.stop();return}try{recognition.start();listening=true;voiceBtn.textContent='■ Stop listening';voiceStatus.textContent='Listening… speak your idea.'}catch{voiceStatus.textContent='Could not start voice input. Try the keyboard microphone.'}}}else{voiceBtn.disabled=true;voiceStatus.textContent='Browser voice recognition is unavailable. Tap the idea field and use the microphone on your iPhone keyboard instead.'}load();render();</script></body></html>
